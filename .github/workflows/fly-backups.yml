# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Backup data
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fly-backups.yml"
  schedule:
    - cron: "0 2 * * *"

jobs:
  backup:
    name: Backup data
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - name: Get machine ID
        id: machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "id=$(flyctl machines list --app "${{ secrets.FLY_APP_NAME }}" --json | jq -r '.[0].id')" >> $GITHUB_OUTPUT
      - name: Start machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MACHINE_ID: ${{ steps.machine.outputs.id }}
        run: |
          flyctl machine start --app "${{ secrets.FLY_APP_NAME }}" "$MACHINE_ID"
      - name: Get backup data
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh sftp get --app "${{ secrets.FLY_APP_NAME }}" /data ./data --recursive
      - name: Install rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
      - name: Upload to B2
        env:
          RCLONE_B2_ACCOUNT: "${{ secrets.B2_ACCOUNT_ID }}"
          RCLONE_B2_KEY: "${{ secrets.B2_ACCOUNT_KEY }}"
        run: |
          rclone copy ./data ":b2:${{ secrets.B2_BUCKET_NAME }}/vaultwarden/copy/"
